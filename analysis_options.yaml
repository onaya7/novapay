include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
linter:
  rules:
    public_member_api_docs: false
    # Suggests `const .named(...)` for a named constructor, but the Dart
    # 3.13.2 compiler rejects that form (field_initializer_outside_constructor),
    # so the fix the lint asks for does not build. Disabled until they agree.
    unnecessary_type_name_in_constructor: false
