name: novapay
description: novapay
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  cupertino_ui: ^1.1.0
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.2.3
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  local_auth: ^2.3.0
  logger: ^2.8.0
  material_ui: ^1.1.1
  meta: ^1.19.0
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.0
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.11.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/banks/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_gen:
  integrations:
    flutter_svg: false
